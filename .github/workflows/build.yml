name: windows-build

# 只手动触发（不在 push / PR 时自动跑，省额度）
on:
  workflow_dispatch:
    inputs:
      src_tag:
        description: 源码快照所在的 Release 标签（src-<时间>）
        required: true
      src_asset:
        description: 快照文件名（zhitong-src-<时间>.tar.gz）
        required: true
      src_sha256:
        description: 快照的 SHA256
        required: true
      mode:
        description: quick = 构建 + 快测；full = 再加全测；preview = 全测 + 预览版验收（真实 Claude / Codex、外壳登录）+ 预览 zip；install = 构建 + NSIS 安装包 + 安装卸载验收（不跑快测全测）
        default: quick
        type: choice
        options: [quick, full, preview, install]
      skip_shell:
        description: 跳过 Tauri 外壳编译（只验证服务能起来）
        default: false
        type: boolean

permissions:
  contents: write   # 读草稿 Release 的附件需要写权限

concurrency:
  group: windows-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: 取源码快照并核对哈希
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 草稿 Release 按标签查不到，改为列出 Release 按名字找附件，再用接口下载（令牌只走请求头，不打印）
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=50" | ConvertFrom-Json
          $rel = $rels | Where-Object { $_.name -eq '${{ inputs.src_tag }}' } | Select-Object -First 1
          if (-not $rel) { throw '找不到草稿 Release ${{ inputs.src_tag }}' }
          $asset = $rel.assets | Where-Object { $_.name -eq '${{ inputs.src_asset }}' } | Select-Object -First 1
          if (-not $asset) { throw '草稿 Release 里没有 ${{ inputs.src_asset }}' }
          New-Item -ItemType Directory -Force -Path _src_dl | Out-Null
          $f = Join-Path _src_dl '${{ inputs.src_asset }}'
          curl.exe -sSfL -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' -o $f $asset.url
          if ($LASTEXITCODE -ne 0) { throw '下载快照失败' }
          $got = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
          if ($got -ne "${{ inputs.src_sha256 }}") { throw "快照哈希不一致：$got" }
          New-Item -ItemType Directory -Force -Path src | Out-Null
          tar -xzf $f -C src
          if ($LASTEXITCODE -ne 0) { throw '解压快照失败' }
          Get-ChildItem src | Select-Object Name

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: 缓存 Rust 编译结果
        if: ${{ !inputs.skip_shell }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/winapp/src-tauri -> target

      - name: 缓存下载的 Node / Python 包
        uses: actions/cache@v4
        with:
          path: out/_cache
          key: winvendor-node24.18.0-py3.13.17-20261021

      - name: 构建
        run: |
          $a = @('-SourceDir', 'src', '-OutDir', 'out')
          if ('${{ inputs.skip_shell }}' -eq 'true') { $a += '-SkipShell' }
          if ('${{ inputs.mode }}' -eq 'install') { $a += '-Installer' }
          pwsh -File src/winapp/build.ps1 @a

      - name: 快测（服务启动、/ 返回 200、外壳拉起服务）
        if: ${{ inputs.mode != 'install' }}
        run: |
          $zip = Get-ChildItem out -Filter 'ZHITONG-*-win-x64.zip' | Select-Object -First 1
          $a = @('-Zip', $zip.FullName, '-WorkDir', 'smoke')
          if ('${{ inputs.skip_shell }}' -eq 'true') { $a += '-SkipShell' }
          pwsh -File src/winapp/ci/smoke.ps1 @a

      - name: 全测
        if: ${{ inputs.mode == 'full' || inputs.mode == 'preview' }}
        run: |
          if (Test-Path src/winapp/ci/full.ps1) { pwsh -File src/winapp/ci/full.ps1 -WorkDir smoke } else { Write-Host '全测脚本还没有（M3 起补）' }

      - name: 预览版验收和打包（官方方式装 Claude Code / Codex，外壳里登录和开窗口，打预览 zip）
        if: ${{ inputs.mode == 'preview' }}
        run: pwsh -File src/winapp/ci/preview.ps1 -WorkDir smoke -OutDir out -SourceDir src

      - name: 安装包验收（装、升级、重装、回退、清理、卸载、普通用户）
        if: ${{ inputs.mode == 'install' }}
        run: pwsh -File src/winapp/ci/install.ps1 -WorkDir inst -OutDir out -SourceDir src

      - name: 收集日志
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path report | Out-Null
          foreach ($f in 'out/build_info.json', 'out/timings.json', 'smoke/smoke_result.json', 'smoke/shell_window.png', 'smoke/full_result.json', 'smoke/termd_bench.json') { if (Test-Path $f) { Copy-Item $f report/ } }
          Get-ChildItem smoke -Filter 'full_*.txt' -ErrorAction SilentlyContinue | Copy-Item -Destination report/
          if (Test-Path inst/report) { Copy-Item -Recurse inst/report report/install }
          if (Test-Path smoke/preview) { New-Item -ItemType Directory -Force -Path report/preview | Out-Null; Get-ChildItem smoke/preview -File | Copy-Item -Destination report/preview/ }
          foreach ($d in 'smoke/data/logs', 'smoke/shelldata/logs', 'smoke/preview/data/logs') { if (Test-Path $d) { Copy-Item -Recurse $d ("report/" + ($d -replace '[/\\]', '_')) } }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report
          retention-days: 1

      # 预览 zip 留在 Actions 产物里（怎么发给客户由主线程决定），保留 14 天
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.mode == 'preview' }}
        with:
          name: zhitong-win-preview
          path: out/ZHITONG-*-preview-win-x64.zip
          retention-days: 1
          compression-level: 0

      # 前面有一步没过时，已经打好的预览 zip 也留下来（名字带 unverified，只用来查问题，不准上线），不用为一条验收整轮重来。
      # 只在没全过时传：全过时上面那份就是同一个文件，不重复占存储
      - name: 没验收过的预览 zip 改名
        if: ${{ always() && !success() && inputs.mode == 'preview' }}
        run: |
          New-Item -ItemType Directory -Force -Path unverified | Out-Null
          Get-ChildItem out -Filter 'ZHITONG-*-preview-win-x64.zip' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName (Join-Path unverified ($_.BaseName + '-unverified.zip')) }
          Get-ChildItem unverified | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !success() && inputs.mode == 'preview' }}
        with:
          name: zhitong-win-preview-unverified
          path: unverified/*.zip
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.mode == 'install' }}
        with:
          name: zhitong-win-setup
          path: out/ZHITONG-*-win-x64-setup.exe
          retention-days: 1
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zhitong-win-x64
          path: |
            out/ZHITONG-*-win-x64.zip
            !out/ZHITONG-*-preview-win-x64.zip
          retention-days: 1
          compression-level: 0
